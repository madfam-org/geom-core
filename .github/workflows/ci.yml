name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "claude/*" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript-build:
    name: TypeScript package build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      with:
        version: 9.15.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm typecheck
    - run: pnpm lint
    - run: pnpm build:ts
    - run: pnpm test

  # ========================================
  # Job 1: Build and Test Python Bindings
  # ========================================
  python-build:
    name: Python Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']
        exclude:
          # Reduce matrix size for faster CI
          - os: macos-latest
            python-version: '3.8'
          - os: macos-latest
            python-version: '3.9'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential python3-dev \
          libocct-data-exchange-dev libocct-ocaf-dev libocct-modeling-data-dev \
          libocct-modeling-algorithms-dev libocct-foundation-dev libocct-visualization-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake opencascade
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel pybind11
        # Oracle for the differential integrity tests (not runtime deps)
        pip install numpy trimesh
    
    - name: Build Python extension
      run: |
        chmod +x scripts/build_python.sh
        ./scripts/build_python.sh
    
    - name: Run native C++ unit tests (CTest)
      run: ctest --test-dir build --output-on-failure

    - name: Run tests
      env:
        GEOM_REQUIRE_OCCT: "1"
      run: |
        chmod +x scripts/run_tests.sh
        ./scripts/run_tests.sh
    
    - name: Upload Python artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: python-${{ matrix.os }}-${{ matrix.python-version }}
        path: build/python/geom_core_py.*

  # ========================================
  # Job 2: Build WASM
  # ========================================
  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Install Closure compiler Java runtime
      uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: '21'
    
    - name: Set up Emscripten
      uses: mymindstorm/setup-emsdk@ab889da2abbcbb280f91ec4c215d3bb4f3a8f775 # v12
      with:
        version: '6.0.10'
        # setup-emsdk v12 makes a competing cache reservation fatal. Avoid its
        # shared cache so provisioning cannot mask the actual WASM build result.
        no-cache: true
    
    - name: Verify Emscripten
      run: |
        emcc --version
        which emcmake
    
    - name: Build WASM
      run: |
        chmod +x scripts/build_wasm.sh
        ./scripts/build_wasm.sh

    - name: Verify native CAD capability and STL contracts
      run: bash scripts/test_cad_contract.sh

    - name: Verify real threaded WASM geometry
      run: node tests/wasm/runtime.cjs
    
    - name: Upload WASM artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: wasm-dist
        path: dist/

    - name: Verify WASM without SharedArrayBuffer
      run: |
        ./scripts/build_wasm.sh --no-threads
        node tests/wasm/runtime.cjs
    
    - name: List artifacts
      run: |
        echo "WASM build artifacts:"
        ls -lh dist/

  # ========================================
  # Job 3: Python Package Build
  # ========================================
  python-package:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: python-build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    
    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: '3.10'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build source and wheel distributions
      run: |
        python -m build
    
    - name: Verify installed wheel outside the source tree
      run: |
        python -m venv /tmp/geom-wheel-check
        /tmp/geom-wheel-check/bin/pip install dist/*.whl
        cd /tmp
        /tmp/geom-wheel-check/bin/python -c 'import geom_core_py; assert geom_core_py.Analyzer().get_vertex_count() == 0'

    - name: Check distribution
      run: |
        twine check dist/*
    
    - name: Upload package artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: python-package
        path: dist/

  # ========================================
  # Job 4: Code Quality Checks
  # ========================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    
    - name: Set up Python
      uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: '3.10'
    
    - name: Install linting tools
      run: |
        pip install black==24.10.0 flake8==7.1.1
    
    - name: Check Python formatting (Black)
      run: |
        black --check --target-version py38 tests/
    
    - name: Python syntax and undefined-name checks (Flake8)
      run: |
        flake8 tests/ --select E9,F63,F7,F82

    - name: Version agrees across pyproject, CMake, package.json and index.ts
      run: python tests/test_version.py
