name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "claude/*" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  typescript-build:
    name: TypeScript package build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pnpm/action-setup@v4
      with:
        version: 9.15.0
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm typecheck
    - run: pnpm build:ts
    - run: pnpm test

  # ========================================
  # Job 1: Build and Test Python Bindings
  # ========================================
  python-build:
    name: Python Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11']
        exclude:
          # Reduce matrix size for faster CI
          - os: macos-latest
            python-version: '3.8'
          - os: macos-latest
            python-version: '3.9'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential python3-dev \
          libocct-data-exchange-dev libocct-ocaf-dev libocct-modeling-data-dev \
          libocct-modeling-algorithms-dev libocct-foundation-dev libocct-visualization-dev

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake opencascade
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel pybind11
    
    - name: Build Python extension
      run: |
        chmod +x scripts/build_python.sh
        ./scripts/build_python.sh
    
    - name: Run tests
      env:
        GEOM_REQUIRE_OCCT: "1"
      run: |
        chmod +x scripts/run_tests.sh
        ./scripts/run_tests.sh
    
    - name: Upload Python artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-${{ matrix.os }}-${{ matrix.python-version }}
        path: build/python/geom_core_py.*

  # ========================================
  # Job 2: Build WASM
  # ========================================
  wasm-build:
    name: WASM Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Emscripten
      uses: mymindstorm/setup-emsdk@v12
      with:
        version: '6.0.10'
        # setup-emsdk v12 makes a competing cache reservation fatal. Avoid its
        # shared cache so provisioning cannot mask the actual WASM build result.
        no-cache: true
    
    - name: Verify Emscripten
      run: |
        emcc --version
        which emcmake
    
    - name: Build WASM
      run: |
        chmod +x scripts/build_wasm.sh
        ./scripts/build_wasm.sh
    
    - name: Upload WASM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wasm-dist
        path: dist/
    
    - name: List artifacts
      run: |
        echo "WASM build artifacts:"
        ls -lh dist/

  # ========================================
  # Job 3: Python Package Build
  # ========================================
  python-package:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: python-build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build source and wheel distributions
      run: |
        python -m build
    
    - name: Verify installed wheel outside the source tree
      run: |
        python -m venv /tmp/geom-wheel-check
        /tmp/geom-wheel-check/bin/pip install dist/*.whl
        cd /tmp
        /tmp/geom-wheel-check/bin/python -c 'import geom_core_py; assert geom_core_py.Analyzer().get_vertex_count() == 0'

    - name: Check distribution
      run: |
        twine check dist/*
    
    - name: Upload package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package
        path: dist/

  # ========================================
  # Job 4: Code Quality Checks
  # ========================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install linting tools
      run: |
        pip install black==24.10.0 flake8==7.1.1
    
    - name: Check Python formatting (Black)
      run: |
        black --check --target-version py38 tests/
    
    - name: Python syntax and undefined-name checks (Flake8)
      run: |
        flake8 tests/ --select E9,F63,F7,F82
    

  # ========================================
  # Job 5: Documentation Check
  # ========================================
  documentation:
    name: Documentation Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Check README
      run: |
        if [ -f README.md ]; then
          echo "README.md exists"
          wc -l README.md
        else
          echo "Warning: README.md not found"
        fi
    
    - name: Check LICENSE
      run: |
        if [ -f LICENSE ]; then
          echo "LICENSE exists"
        else
          echo "Warning: LICENSE not found"
        fi
