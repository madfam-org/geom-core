name: Release

# Builds the Python wheels + sdist and the WASM/TypeScript npm tarball, runs
# the same test suites CI runs, and attaches the artefacts to a GitHub
# Release. A `v*` tag publishes the Release; workflow_dispatch is a dry run
# that only uploads the artefacts to the workflow run.
#
# No PyPI or npm publishing happens here: those need owner credentials
# (see README "Publishing to PyPI/npm (owner)").

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check tag matches version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Manifests agree
      run: python3 tests/test_version.py
    - id: read
      name: Read version from pyproject.toml
      run: |
        version=$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' pyproject.toml | head -n 1)
        test -n "$version"
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - name: Tag must equal v<version>
      if: startsWith(github.ref, 'refs/tags/')
      env:
        VERSION: ${{ steps.read.outputs.version }}
      run: |
        if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
          echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $VERSION"
          exit 1
        fi

  # macOS wheels (py3.10–3.12) carry arm64 + x86_64 slices. Linux wheels come
  # from the `wheels-linux` job below (cibuildwheel, manylinux_2_28). Wheels
  # are built without OCCT so they do not link a runner's system
  # OpenCASCADE; STEP loading reports has_occt == False in released wheels.
  wheels:
    name: Wheel (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Build wheel
      env:
        # setup.py maps ARCHFLAGS to CMAKE_OSX_ARCHITECTURES. The macOS
        # interpreters tag wheels universal2, so build both slices (0.1.0's
        # universal2 wheels held arm64 code only and failed to import on Intel).
        ARCHFLAGS: ${{ runner.os == 'macOS' && '-arch arm64 -arch x86_64' || '' }}
      run: |
        python -m pip install --upgrade pip
        python -m pip wheel . --no-deps -w wheelhouse
    - name: macOS wheel holds every architecture its tag names
      if: runner.os == 'macOS'
      run: |
        set -euo pipefail
        for wheel in wheelhouse/*.whl; do
          dir=$(mktemp -d)
          unzip -q "$wheel" -d "$dir"
          archs=$(lipo -archs "$dir"/geom_core_py*.so)
          echo "$(basename "$wheel"): $archs"
          case "$wheel" in
            *universal2*) need="arm64 x86_64" ;;
            *arm64*) need="arm64" ;;
            *x86_64*) need="x86_64" ;;
            *) echo "::error::unexpected macOS wheel tag: $wheel"; exit 1 ;;
          esac
          for arch in $need; do
            grep -qw "$arch" <<< "$archs" || { echo "::error::$(basename "$wheel") lacks $arch (has: $archs)"; exit 1; }
          done
        done
    - name: Test the installed wheel outside the build tree
      run: |
        python -m venv "$RUNNER_TEMP/wheel-venv"
        "$RUNNER_TEMP/wheel-venv/bin/pip" install wheelhouse/*.whl numpy trimesh
        # Remove the in-tree setuptools/CMake build so the test scripts
        # (which prefer build/python when present) import the wheel.
        rm -rf build
        PATH="$RUNNER_TEMP/wheel-venv/bin:$PATH" ./scripts/run_tests.sh
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: wheel-${{ matrix.os }}-${{ matrix.python-version }}
        path: wheelhouse/*.whl
        if-no-files-found: error

  # Linux x86_64 wheels for cp38–cp312, built in the manylinux_2_28 image
  # (AlmaLinux 8, glibc 2.28) and repaired by auditwheel, so they carry the
  # manylinux_2_28_x86_64 tag: they install on any glibc >= 2.28 (Debian
  # bookworm and trixie, Ubuntu 20.04+, RHEL 8+) and are uploadable to PyPI.
  # Until 0.2.0 the Linux wheels were built on the runner (Ubuntu 24.04) with
  # the plain linux_x86_64 tag and needed GLIBCXX_3.4.32 / GLIBC_2.32, i.e. a
  # base image at least as new as Debian trixie.
  wheels-linux:
    name: Wheels (Linux, manylinux_2_28, cp38-cp312)
    needs: version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: pypa/cibuildwheel@c923d83ad9c1bc00211c5041d0c3f73294ff88f6 # v3.1.4
      with:
        output-dir: wheelhouse
      env:
        CIBW_BUILD: cp38-manylinux_x86_64 cp39-manylinux_x86_64 cp310-manylinux_x86_64 cp311-manylinux_x86_64 cp312-manylinux_x86_64
        CIBW_ARCHS_LINUX: x86_64
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
        CIBW_BUILD_VERBOSITY: 1
        # The same suite the macOS leg runs, against the installed wheel: the
        # in-tree build/ is removed so run_tests.sh cannot import it instead.
        CIBW_TEST_REQUIRES: numpy trimesh
        CIBW_TEST_COMMAND: cd {project} && rm -rf build && ./scripts/run_tests.sh
    - name: Every Linux wheel is manylinux_2_28 and none is plain linux_x86_64
      run: |
        set -euo pipefail
        ls -l wheelhouse
        count=0
        for wheel in wheelhouse/*.whl; do
          tag=$(unzip -p "$wheel" '*.dist-info/WHEEL' | sed -n 's/^Tag: //p')
          echo "$(basename "$wheel"): $tag"
          case "$tag" in
            *-manylinux_2_28_x86_64) count=$((count + 1)) ;;
            *) echo "::error::$(basename "$wheel") is tagged $tag, not manylinux_2_28_x86_64"; exit 1 ;;
          esac
        done
        test "$count" -eq 5 || { echo "::error::expected 5 Linux wheels (cp38-cp312), got $count"; exit 1; }
        python3 -m pip install --quiet auditwheel
        for wheel in wheelhouse/*.whl; do python3 -m auditwheel show "$wheel"; done
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: wheel-linux-manylinux_2_28
        path: wheelhouse/*.whl
        if-no-files-found: error

  sdist:
    name: Source distribution
    needs: version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4.9.1
      with:
        python-version: '3.10'
    - name: Build and check sdist
      run: |
        python -m pip install --upgrade pip build twine
        python -m build --sdist
        twine check dist/*
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: sdist
        path: dist/*.tar.gz
        if-no-files-found: error

  npm-tarball:
    name: WASM + TypeScript npm tarball
    needs: version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
      with:
        distribution: temurin
        java-version: '21'
    - uses: mymindstorm/setup-emsdk@ab889da2abbcbb280f91ec4c215d3bb4f3a8f775 # v12
      with:
        version: '6.0.10'
        no-cache: true
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      with:
        version: 9.15.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '20'
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm typecheck
    - run: pnpm lint
    - run: pnpm build:ts
    - run: pnpm test
    - name: Build WASM (single-threaded default + threaded opt-in, as ci.yml)
      run: ./scripts/build_wasm.sh
    - name: Test the WASM modules
      run: |
        pnpm test:wasm
        pnpm test:wasm:threaded
    - name: Pack
      run: |
        set -o pipefail
        mkdir -p npm-dist
        npm pack --pack-destination npm-dist
        listing=$(tar -tzf npm-dist/*.tgz)
        for f in dist/esm/index.js dist/wasm/package.json \
                 dist/wasm/index.js dist/wasm/index.d.ts dist/wasm/geom-core.js dist/wasm/geom-core.wasm \
                 dist/wasm/threaded.js dist/wasm/threaded.d.ts dist/wasm/geom-core-threaded.js dist/wasm/geom-core-threaded.wasm \
                 dist/wasm/loader.js dist/wasm/loader.d.ts dist/wasm/types.d.ts; do
          grep -qx "package/$f" <<< "$listing" || { echo "::error::npm tarball is missing $f"; exit 1; }
        done
        {
          echo "### npm tarball"
          echo ""
          echo "| File | Bytes |"
          echo "|---|---:|"
          tar -tvzf npm-dist/*.tgz | awk '$6 ~ /^package\/dist\/wasm\// { printf "| `%s` | %s |\n", substr($6, 9), $3 }'
          echo ""
          echo "Tarball: $(stat -c %s npm-dist/*.tgz) bytes"
        } | tee -a "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: npm-tarball
        path: npm-dist/*.tgz
        if-no-files-found: error

  release:
    name: Attach artefacts to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, wheels, wheels-linux, sdist, npm-tarball]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        path: release-assets
        merge-multiple: true
    - run: ls -l release-assets
    - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        token: ${{ github.token }}
        name: geom-core v${{ needs.version.outputs.version }}
        files: release-assets/*
        fail_on_unmatched_files: true
